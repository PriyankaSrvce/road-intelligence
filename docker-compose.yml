services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: roads
      POSTGRES_USER: roads
      POSTGRES_PASSWORD: change_me_locally
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roads -d roads"]
      interval: 5s
      retries: 10
volumes:
  pgdata:

